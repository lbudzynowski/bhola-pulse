local base_width = 760
local base_height = 570
local base_gap = 28
local default_scale = 1.25
local scale = tonumber(os.getenv('BHOLA_SCALE')) or default_scale
scale = math.max(1.0, math.min(1.5, scale))

local panel_width = math.floor(base_width * scale + 0.5)
local panel_height = math.floor(base_height * scale + 0.5)
local panel_gap = math.floor(base_gap * scale + 0.5)

conky.config = {
    alignment = 'top_right',
    background = false,
    border_width = 0,
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = false,
    gap_x = panel_gap,
    gap_y = panel_gap,
    lua_load = 'conky/bhola_pulse.lua',
    lua_draw_hook_post = 'draw_bhola',
    maximum_width = panel_width,
    minimum_height = panel_height,
    minimum_width = panel_width,
    own_window = true,
    own_window_argb_value = 0,
    own_window_argb_visual = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_title = os.getenv('BHOLA_WINDOW_TITLE') or 'conky (Bhola)',
    own_window_transparent = true,
    own_window_type = 'desktop',
    text_buffer_size = 256,
    update_interval = tonumber(os.getenv('BHOLA_UPDATE_INTERVAL')) or 0.15,
    use_spacer = 'none',
    use_xft = true,
}

conky.text = [[ ]]
