name: Debian source package

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "VERSION"
      - "packaging/**"
      - "scripts/run-dev.sh"
      - "src/**"
      - "conky/**"
      - "config/**"
      - "debian/**"
      - ".github/workflows/source-package.yml"
  pull_request:
    paths:
      - "VERSION"
      - "packaging/**"
      - "scripts/run-dev.sh"
      - "src/**"
      - "conky/**"
      - "config/**"
      - "debian/**"
      - ".github/workflows/source-package.yml"

permissions:
  contents: read

jobs:
  source-package:
    name: Source package (${{ matrix.series }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        series:
          - noble
          - resolute

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Debian source packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential debhelper devscripts

      - name: Determine released PPA payload eligibility
        id: ppa
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=debian/ppa-release.conf
          source debian/ppa-release.conf
          if git diff --quiet "$PPA_UPSTREAM_REF" HEAD -- "${PPA_RUNTIME_PATHS[@]}"; then
            printf 'eligible=true\n' >> "$GITHUB_OUTPUT"
            printf 'Current runtime matches the immutable %s release payload.\n' "$PPA_RELEASE_TAG"
          else
            printf 'eligible=false\n' >> "$GITHUB_OUTPUT"
            printf 'Current runtime differs from the immutable %s release payload.\n' "$PPA_RELEASE_TAG"
          fi

      - name: Build released PPA source package
        if: steps.ppa.outputs.eligible == 'true'
        run: bash debian/build-ppa-source "${{ matrix.series }}"

      - name: Prove released PPA builder stays fail-closed
        if: steps.ppa.outputs.eligible != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if bash debian/build-ppa-source "${{ matrix.series }}"; then
            printf 'Released PPA builder unexpectedly accepted changed runtime payload.\n' >&2
            exit 1
          fi
          printf 'Released PPA builder correctly rejected changed runtime payload.\n'

      - name: Validate released PPA source package
        if: steps.ppa.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          series="${{ matrix.series }}"
          # shellcheck source=debian/ppa-release.conf
          source debian/ppa-release.conf
          expected="${PPA_UPSTREAM_VERSION}-${PPA_DEBIAN_REVISION}~ppa${PPA_ITERATION}~${series}1"
          plain_revision="${PPA_UPSTREAM_VERSION}-${PPA_DEBIAN_REVISION}"
          source_root="build/ppa/${series}"
          changes="${source_root}/bhola-pulse_${expected}_source.changes"
          dsc="${source_root}/bhola-pulse_${expected}.dsc"
          buildinfo="${source_root}/bhola-pulse_${expected}_source.buildinfo"
          orig="bhola-pulse_${PPA_UPSTREAM_VERSION}.orig.tar.xz"

          test -f "$changes"
          test -f "$dsc"
          test -f "$buildinfo"
          test -f "${source_root}/${orig}"
          grep -Fx "Distribution: ${series}" "$changes"
          grep -Fx "Version: ${expected}" "$changes"
          dpkg --compare-versions "$expected" gt "$PPA_RELEASE_BINARY_VERSION"
          dpkg --compare-versions "$expected" lt "$plain_revision"

          if [[ $series == noble ]]; then
            grep -F " ${orig}" "$changes"
          elif grep -F " ${orig}" "$changes" >/dev/null; then
            printf 'Resolute -sd upload unexpectedly contains the upstream archive.\n' >&2
            exit 1
          fi

          (
            cd "$source_root"
            awk '
              BEGIN { section = 0 }
              /^Checksums-Sha256:/ { section = 1; next }
              section && /^[^ ]/ { exit }
              section { print $1 "  " $3 }
            ' "$(basename -- "$changes")" | sha256sum --check --strict -
          )

          extracted="$RUNNER_TEMP/ppa-source-${series}"
          dpkg-source --extract "$dsc" "$extracted"
          test ! -e "$extracted/debian/debian"
          test "$(tr -d '[:space:]' < "$extracted/VERSION")" = "$PPA_UPSTREAM_VERSION"
          (
            cd "$extracted"
            dpkg-buildpackage --build=binary --unsigned-source --unsigned-changes
          )

          deb="$RUNNER_TEMP/bhola-pulse_${expected}_all.deb"
          test -f "$deb"
          test "$(dpkg-deb --field "$deb" Package)" = bhola-pulse
          test "$(dpkg-deb --field "$deb" Version)" = "$expected"
          test "$(dpkg-deb --field "$deb" Architecture)" = all
          package_root="$RUNNER_TEMP/ppa-package-${series}"
          dpkg-deb --extract "$deb" "$package_root"
          test -x "$package_root/usr/bin/bhola-pulse"
          test -x "$package_root/usr/lib/bhola-pulse/bhola-pulse-ufw-probe"
          test -x "$package_root/usr/lib/bhola-pulse/scripts/run-dev.sh"
          test -f "$package_root/lib/systemd/system/bhola-pulse-ufw-probe.service"
          test -f "$package_root/lib/systemd/system/bhola-pulse-ufw-probe.timer"
          test "$(stat -c '%a' "$package_root/usr/lib/bhola-pulse/bhola-pulse-ufw-probe")" = 755
          test "$(stat -c '%a' "$package_root/lib/systemd/system/bhola-pulse-ufw-probe.service")" = 644
          test "$(stat -c '%a' "$package_root/lib/systemd/system/bhola-pulse-ufw-probe.timer")" = 644
          test -f "$package_root/usr/lib/bhola-pulse/conky/bhola_render.lua"
          test -f "$package_root/usr/lib/bhola-pulse/conky/bhola_render_nerd.lua"
          test ! -e "$package_root/usr/lib/bhola-pulse/state"
          if find "$package_root" -type d ! -perm 0755 -print -quit | grep -q .; then
            printf 'PPA source-built package contains a directory whose mode is not 0755.\n' >&2
            find "$package_root" -type d ! -perm 0755 -printf '%m %p\n' >&2
            exit 1
          fi
          HOME="$RUNNER_TEMP/ppa-home-${series}" \
          XDG_CONFIG_HOME="$RUNNER_TEMP/ppa-config-${series}" \
          XDG_STATE_HOME="$RUNNER_TEMP/ppa-state-${series}" \
          BHOLA_PULSE_LIBDIR="$package_root/usr/lib/bhola-pulse" \
            "$package_root/usr/bin/bhola-pulse" --version | grep -Fx "Bhola Pulse ${PPA_UPSTREAM_VERSION}"

      - name: Upload released PPA source files
        if: steps.ppa.outputs.eligible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bhola-pulse-ppa-source-${{ matrix.series }}
          path: |
            build/ppa/${{ matrix.series }}/*.dsc
            build/ppa/${{ matrix.series }}/*_source.changes
            build/ppa/${{ matrix.series }}/*_source.buildinfo
            build/ppa/${{ matrix.series }}/*.tar.*
          if-no-files-found: error

      - name: Build unsigned PR-validation source package
        run: bash debian/build-pr-source "${{ matrix.series }}"

      - name: Extract, rebuild, and inspect PR-validation source package
        shell: bash
        run: |
          set -euo pipefail
          series="${{ matrix.series }}"
          version=$(tr -d '[:space:]' < VERSION)
          expected="${version}-1~pr1~${series}1"
          source_root="build/pr/${series}"
          changes="${source_root}/bhola-pulse_${expected}_source.changes"
          dsc="${source_root}/bhola-pulse_${expected}.dsc"
          buildinfo="${source_root}/bhola-pulse_${expected}_source.buildinfo"
          test -f "$changes"
          test -f "$dsc"
          test -f "$buildinfo"
          grep -Fx "Distribution: ${series}" "$changes"
          grep -Fx "Version: ${expected}" "$changes"
          (
            cd "$source_root"
            awk '
              BEGIN { section = 0 }
              /^Checksums-Sha256:/ { section = 1; next }
              section && /^[^ ]/ { exit }
              section { print $1 "  " $3 }
            ' "$(basename -- "$changes")" | sha256sum --check --strict -
          )
          extracted="$RUNNER_TEMP/source-${series}"
          dpkg-source --extract "$dsc" "$extracted"
          (
            cd "$extracted"
            dpkg-buildpackage --build=binary --unsigned-source --unsigned-changes
          )
          deb="$RUNNER_TEMP/bhola-pulse_${expected}_all.deb"
          test -f "$deb"
          test "$(dpkg-deb --field "$deb" Package)" = bhola-pulse
          test "$(dpkg-deb --field "$deb" Version)" = "$expected"
          test "$(dpkg-deb --field "$deb" Architecture)" = all
          package_root="$RUNNER_TEMP/package-${series}"
          dpkg-deb --extract "$deb" "$package_root"
          test -x "$package_root/usr/bin/bhola-pulse"
          test -x "$package_root/usr/lib/bhola-pulse/bhola-pulse-ufw-probe"
          test -x "$package_root/usr/lib/bhola-pulse/scripts/run-dev.sh"
          test -f "$package_root/lib/systemd/system/bhola-pulse-ufw-probe.service"
          test -f "$package_root/lib/systemd/system/bhola-pulse-ufw-probe.timer"
          test "$(stat -c '%a' "$package_root/usr/lib/bhola-pulse/bhola-pulse-ufw-probe")" = 755
          test "$(stat -c '%a' "$package_root/lib/systemd/system/bhola-pulse-ufw-probe.service")" = 644
          test "$(stat -c '%a' "$package_root/lib/systemd/system/bhola-pulse-ufw-probe.timer")" = 644
          test -f "$package_root/usr/lib/bhola-pulse/conky/bhola_render.lua"
          test -f "$package_root/usr/lib/bhola-pulse/conky/bhola_render_nerd.lua"
          test ! -e "$package_root/usr/lib/bhola-pulse/state"
          if find "$package_root" -type d ! -perm 0755 -print -quit | grep -q .; then
            printf 'Source-built package contains a directory whose mode is not 0755.\n' >&2
            find "$package_root" -type d ! -perm 0755 -printf '%m %p\n' >&2
            exit 1
          fi
          HOME="$RUNNER_TEMP/home-${series}" \
          XDG_CONFIG_HOME="$RUNNER_TEMP/config-${series}" \
          XDG_STATE_HOME="$RUNNER_TEMP/state-${series}" \
          BHOLA_PULSE_LIBDIR="$package_root/usr/lib/bhola-pulse" \
            "$package_root/usr/bin/bhola-pulse" --version | grep -Fx "Bhola Pulse ${version}"

      - name: Upload PR-validation source package files
        uses: actions/upload-artifact@v4
        with:
          name: bhola-pulse-pr-source-${{ matrix.series }}
          path: |
            build/pr/${{ matrix.series }}/*.dsc
            build/pr/${{ matrix.series }}/*_source.changes
            build/pr/${{ matrix.series }}/*_source.buildinfo
            build/pr/${{ matrix.series }}/*.tar.*
          if-no-files-found: error
