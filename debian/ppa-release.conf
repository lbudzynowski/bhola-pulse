# shellcheck shell=bash

# Immutable release identity used by the signed Launchpad source builder.
PPA_RELEASE_TAG=v0.1.2
PPA_UPSTREAM_VERSION=0.1.2
PPA_UPSTREAM_REF=009ca2331f2a14159f26a31fe7fa193859676750

# The PPA revision is deliberately newer than the GitHub .deb (0.1.2-1),
# while remaining older than a future plain Debian revision 0.1.2-2.
PPA_RELEASE_BINARY_VERSION=0.1.2-1
PPA_DEBIAN_REVISION=2
PPA_ITERATION=1

# Only these release-snapshot paths may affect the installed runtime payload.
PPA_RUNTIME_PATHS=(
    VERSION
    packaging
    scripts/run-dev.sh
    src
    conky
    config
)
